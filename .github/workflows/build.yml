name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet test tests/Companion.Tests/Companion.Tests.csproj -c Release --logger trx
      - run: node scripts/test-pages.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/Companion.Tests/TestResults/*.trx
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build src/Jellyfin.Plugin.Companion/Jellyfin.Plugin.Companion.csproj -c Release
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Cowabunga-Jellyfin-Companion
          path: artifacts/*
